<!DOCTYPE html>
<html lang="en" data-theme="amoled" data-mode="amoled" data-palette="rose">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>baffling space — the home of my apps</title>
<meta name="description" content="baffling space is a quiet home for a small collection of personal tools: a fitness tracker and a notes app, built independently.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23000'/%3E%3Crect x='5' y='5' width='9' height='9' rx='3' fill='none' stroke='%23e8a3b8' stroke-width='1.6'/%3E%3Crect x='10' y='10' width='9' height='9' rx='3' fill='%23e8a3b8' fill-opacity='.45' stroke='%23e8a3b8' stroke-width='1.6'/%3E%3C/svg%3E">

  r.dataset.theme = t; r.dataset.mode = mode; r.dataset.palette = p; r.classList.add("js");
})();
</script>
<style>
:root {
  --font: "Avenir Next", "Segoe UI Variable Display", "Segoe UI", "SF Pro Display", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --r-sm: 10px; --r-md: 16px; --r-lg: 28px; --r-pill: 999px;
  --ease: cubic-bezier(.22, .8, .24, 1); --t-fast: .16s; --t-med: .32s;
  --ah: 340; --as: 66%;
  --accent: hsl(var(--ah) var(--as) var(--al));
  --accent-soft: hsl(var(--ah) var(--as) var(--al) / .14);
}
[data-palette="graphite"] { --ah: 220; --as: 8%; }
[data-palette="arctic"]   { --ah: 195; --as: 72%; }
[data-palette="lavender"] { --ah: 262; --as: 62%; }
[data-palette="ocean"]    { --ah: 214; --as: 78%; }
[data-palette="forest"]   { --ah: 150; --as: 46%; }
[data-palette="ember"]    { --ah: 22;  --as: 82%; }
[data-palette="rose"]     { --ah: 340; --as: 66%; }
[data-mode="dark"] { color-scheme: dark; --al: 72%; --bg: #0f1114; --text: #eceef1; --muted: #9ba0a9; --glass: rgba(255,255,255,.045); --glass-2: rgba(255,255,255,.075); --panel: rgba(24,26,31,.84); --line: rgba(255,255,255,.09); --hi: rgba(255,255,255,.14); --ta: .24; --on-accent: #0b0c0e; --shadow: 0 24px 60px -28px rgba(0,0,0,.75); }
[data-mode="amoled"] { color-scheme: dark; --al: 72%; --bg: #000; --text: #eceef1; --muted: #9296a0; --glass: rgba(255,255,255,.035); --glass-2: rgba(255,255,255,.06); --panel: rgba(12,12,14,.9); --line: rgba(255,255,255,.08); --hi: rgba(255,255,255,.11); --ta: .16; --on-accent: #050506; --shadow: 0 24px 60px -28px rgba(0,0,0,.9); }
[data-mode="light"] { color-scheme: light; --al: 36%; --bg: #f3f2ef; --text: #181a1f; --muted: #575d68; --glass: rgba(255,255,255,.6); --glass-2: rgba(255,255,255,.82); --panel: rgba(255,255,255,.92); --line: rgba(20,24,34,.11); --hi: rgba(255,255,255,.9); --ta: .22; --on-accent: #fff; --shadow: 0 20px 44px -26px rgba(30,34,48,.35); }
*, *::before, *::after { box-sizing: border-box; }
html { scrollbar-gutter: stable both-edges; -webkit-text-size-adjust: 100%; scroll-padding-top: 5rem; }
body { margin: 0; min-height: 100vh; font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.55; overflow-x: hidden; transition: background-color var(--t-med), color var(--t-med);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.wrap { width: min(1120px, 100% - 2.5rem); margin-inline: auto; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--r-sm); }

/* Atmosphere: gradient fields. Outer element = scroll parallax (JS), ::before = ambient drift (CSS, compositor) */
.atmo { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; contain: strict; }
.atmo i { position: absolute; opacity: var(--ta); will-change: transform; }
.atmo i::before { content: ""; position: absolute; inset: 0; border-radius: 50%; will-change: transform; animation: drift 22s ease-in-out infinite alternate; }
.atmo i:nth-child(1) { width: 80vw; height: 70vh; left: -20vw; top: -24vh; }
.atmo i:nth-child(2) { width: 64vw; height: 64vh; right: -20vw; top: 20vh; }
.atmo i:nth-child(3) { width: 90vw; height: 60vh; left: 5vw; bottom: -30vh; }
.atmo i:nth-child(1)::before { background: radial-gradient(closest-side, hsl(var(--ah) var(--as) 52%), transparent); }
.atmo i:nth-child(2)::before { background: radial-gradient(closest-side, hsl(calc(var(--ah) + 42) var(--as) 50%), transparent); animation-duration: 29s; animation-delay: -9s; animation-direction: alternate-reverse; }
.atmo i:nth-child(3)::before { background: radial-gradient(closest-side, hsl(calc(var(--ah) - 36) var(--as) 46%), transparent); animation-duration: 36s; animation-delay: -17s; }
@keyframes drift { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(9vw,6vh,0) scale(1.2); } 100% { transform: translate3d(-7vw,10vh,0) scale(.9); } }
.spot { position: fixed; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .6s; will-change: transform; background: radial-gradient(closest-side, hsl(var(--ah) var(--as) 60% / .13), transparent); }
.spot.on { opacity: 1; }
.bar { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 40; transform-origin: 0 50%; transform: scaleX(0); will-change: transform; background: linear-gradient(90deg, hsl(calc(var(--ah) - 30) var(--as) 60%), var(--accent)); }

/* Navigation */
.nav { position: sticky; top: 0; z-index: 30; padding-top: .75rem; transition: transform .45s var(--ease); }
.nav.hide { transform: translateY(-130%); }
.nav-in { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .5rem .6rem .5rem 1rem; border: 1px solid var(--line); border-radius: var(--r-pill); background: color-mix(in srgb, var(--bg) 72%, transparent); transition: background var(--t-med), box-shadow var(--t-med); }
.nav.solid .nav-in { background: var(--panel); box-shadow: var(--shadow); }
.brand { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; font-size: 1.02rem; letter-spacing: -.01em; }
.brand svg { width: 24px; height: 24px; flex: none; }
.brand .slash { color: var(--muted); font-weight: 300; margin-inline: .1em; } .brand b { font-weight: 600; } .brand .sp { font-weight: 300; }
.ctrls { display: flex; gap: .35rem; position: relative; }
.ibtn { display: inline-flex; align-items: center; gap: .45rem; height: 40px; min-width: 40px; justify-content: center; padding: 0 .7rem; border: 1px solid transparent; border-radius: var(--r-pill); background: transparent; color: var(--text); font: inherit; font-size: .88rem; cursor: pointer; transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast); }
.ibtn:hover, .ibtn[aria-expanded="true"] { background: var(--glass-2); border-color: var(--line); } .ibtn:active { transform: scale(.96); }
.ibtn svg { width: 18px; height: 18px; flex: none; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: inset 0 0 0 1px var(--hi); }
.menu { position: absolute; top: calc(100% + .55rem); right: 0; z-index: 30; min-width: 200px; padding: .45rem; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); backdrop-filter: blur(30px) saturate(1.4); -webkit-backdrop-filter: blur(30px) saturate(1.4); box-shadow: var(--shadow); }
.menu[hidden] { display: none; }
.opt { display: flex; align-items: center; gap: .65rem; width: 100%; padding: .6rem .7rem; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text); font: inherit; font-size: .92rem; text-align: left; cursor: pointer; }
.opt:hover { background: var(--glass-2); } .opt svg { width: 17px; height: 17px; color: var(--muted); }
.opt .ck { margin-left: auto; width: 16px; height: 16px; color: var(--accent); opacity: 0; }
.opt[aria-checked="true"] { background: var(--accent-soft); } .opt[aria-checked="true"] .ck { opacity: 1; }
.sw { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px var(--hi); }

/* Hero */
.hero { will-change: opacity; position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 5rem 0; }
.js:not(.static) .hero-pin { height: 190vh; height: 190svh; }
.js:not(.static) .hero { position: sticky; top: 0; }
/* Hero: two interlocked links on chains; scroll pulls the chains taut, the link snaps open, everything flies apart */
.hero-art { position: relative; width: min(780px, 100%); aspect-ratio: 1000 / 240; margin: 0 auto .6rem; overflow: hidden; pointer-events: none; animation: fade 1.2s .1s both; }
.hero-art svg { display: block; width: 100%; height: 100%; will-change: transform; }
@media (max-width: 700px) { .hero-art { aspect-ratio: 2.6; } .hero-art svg { width: 160%; height: auto; margin-left: -30%; } }
.hero-art .la { stroke: color-mix(in srgb, var(--text) 85%, var(--bg)); stroke-width: 6; }
.hero-art .lb { stroke: var(--accent); stroke-width: 6; }
.hero-art .gap { stroke: var(--bg); stroke-width: 15; }
.hero-art .ch rect { stroke: var(--muted); stroke-width: 3.4; }
.hero-art .shock { stroke: var(--accent); stroke-width: 2; opacity: 0; }
.hero-art #sparks line { stroke: var(--accent); stroke-width: 3; }
@keyframes fade { from { opacity: 0; } }
.hero .wrap { position: relative; }
.pill { display: inline-flex; align-items: center; gap: .55rem; padding: .38rem .85rem .38rem .7rem; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--glass); font-size: .82rem; color: var(--muted); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: pulse 2.6s ease-in-out infinite; }
h1 { margin: 1.5rem auto 0; font-weight: 300; font-size: clamp(3rem, 11vw, 7.2rem); line-height: .98; letter-spacing: -.045em; }
h1 .ln { display: block; overflow: hidden; padding-bottom: .08em; } h1 .ln span { display: block; animation: up .95s var(--ease) both; }
h1 .ln:nth-child(2) span { animation-delay: .12s; color: var(--muted); }
h1 .ln:first-child span { background: linear-gradient(100deg, var(--text) 30%, var(--accent) 120%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.lede { margin: 1.6rem auto 0; max-width: 40ch; color: var(--muted); font-size: clamp(1.05rem, 2.4vw, 1.25rem); animation: up .9s .3s var(--ease) both; }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin: 2rem 0 0; padding: 0; list-style: none; animation: up .9s .42s var(--ease) both; }
.facts li { display: inline-flex; align-items: center; gap: .45rem; padding: .35rem .75rem; border-radius: var(--r-pill); border: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
.facts svg { width: 14px; height: 14px; color: var(--accent); }
.cue { position: absolute; left: 50%; bottom: 1.2rem; width: 1px; height: 52px; background: var(--line); overflow: hidden; }
.cue::after { content: ""; position: absolute; left: 0; top: 0; width: 1px; height: 22px; background: var(--accent); animation: drip 2s var(--ease) infinite; }

/* Scroll-driven marquee */
.mq { margin: 1rem 0 3.5rem; overflow: hidden; contain: layout paint; user-select: none; }
.mq-row { display: flex; width: max-content; will-change: transform; animation: mq 46s linear infinite; }
.mq-row.b { animation-duration: 58s; animation-direction: reverse; }
.mq.paused .mq-row { animation-play-state: paused; }
@keyframes mq { to { transform: translate3d(-16.6667%, 0, 0); } }
.mq-row span { display: inline-flex; align-items: center; gap: 1.6rem; padding-right: 1.6rem; font-size: clamp(3rem, 9vw, 6.5rem); font-weight: 300; letter-spacing: -.04em; line-height: 1.08; white-space: nowrap; color: transparent; -webkit-text-stroke: 1px color-mix(in srgb, var(--muted) 75%, transparent); }
.mq-row.b span { -webkit-text-stroke: 0; color: color-mix(in srgb, var(--text) 8%, transparent); }
.mq-row i { width: .26em; height: .26em; border-radius: 28%; flex: none; rotate: 45deg; border: 1.5px solid var(--accent); background: var(--accent-soft); }

/* Apps */
.apps { padding-top: 2rem; }
.apps-head { display: flex; flex-direction: column; align-items: center; gap: .3rem; text-align: center; margin-bottom: 2.2rem; }
h2 { margin: 0; font-weight: 300; font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: -.035em; }
.count { color: var(--muted); font-size: .9rem; }
.card { --cc: color-mix(in srgb, hsl(var(--ch) var(--cs) var(--al)) 62%, var(--accent)); --rx: 0deg; --ry: 0deg; --gx: 50%; --gy: 0%;
  position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1.1rem; min-height: 360px; padding: clamp(1.5rem, 3.5vw, 2.2rem); text-align: center; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--cc) 17%, transparent), transparent 62%), var(--glass);
 
  transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .5s var(--ease), border-color var(--t-med); }
.card.live { transition: transform .12s linear, border-color var(--t-med); }
.card::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity var(--t-med); background: radial-gradient(320px circle at var(--gx) var(--gy), color-mix(in srgb, var(--cc) 26%, transparent), transparent 65%); }
.card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; opacity: 0; transition: opacity var(--t-med);
  background: conic-gradient(from var(--ang, 0deg), transparent 0 52%, var(--cc) 82%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
@media (hover: hover) { .card:hover::before, .card:hover::after { opacity: 1; } .card:hover::after { animation: spin 3.2s linear infinite; } }
.card > * { position: relative; }
.card-top { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.icon { display: grid; place-items: center; width: 68px; height: 68px; border-radius: 20px; color: var(--cc); background: color-mix(in srgb, var(--cc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--cc) 30%, transparent); box-shadow: inset 0 1px 0 var(--hi); transform: translateZ(30px); }
.icon svg { width: 32px; height: 32px; animation: bob 5s ease-in-out infinite; }
.status { display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .7rem; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--glass); font-size: .8rem; color: var(--muted); }
.status svg { width: 13px; height: 13px; color: var(--cc); }
.card h3 { margin: .2rem 0 0; font-weight: 400; font-size: clamp(1.7rem, 4vw, 2.2rem); letter-spacing: -.03em; }
.card p { margin: 0 auto; color: var(--muted); max-width: 38ch; }
.tags { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; margin: 0; padding: 0; list-style: none; }
.tags li { padding: .22rem .65rem; border-radius: var(--r-pill); border: 1px solid var(--line); font-size: .78rem; color: var(--muted); }
.foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: .8rem; padding-top: .4rem; }
.open { display: inline-flex; align-items: center; justify-content: center; gap: .6rem; min-height: 50px; padding: 0 1.6rem; border: 0; border-radius: var(--r-pill); background: var(--cc); color: var(--on-accent); font: inherit; font-weight: 600; font-size: .98rem; text-decoration: none; cursor: pointer; box-shadow: 0 10px 26px -10px var(--cc); transition: transform .25s var(--ease), filter var(--t-fast); }
.open:hover { filter: brightness(1.08); } .open:active { transform: scale(.97) !important; }
.open svg { width: 17px; height: 17px; transition: transform var(--t-fast) var(--ease); } .open:hover svg { transform: translate(2px, -2px); }
.open[aria-disabled="true"] { background: transparent; color: var(--muted); border: 1px dashed var(--line); box-shadow: none; cursor: not-allowed; filter: none; }
.hint { font-size: .82rem; color: var(--muted); max-width: 34ch; }

/* Scroll scenes: a 3D object spins with scroll, then the app card appears */
.scene { position: relative; overflow-x: clip; --cc: color-mix(in srgb, hsl(var(--ch) var(--cs) var(--al)) 62%, var(--accent)); }
.stick { display: grid; place-items: center; padding: 1rem 0; }
.obj, .cw { grid-area: 1 / 1; }
.cw { width: min(100%, 520px); display: flex; perspective: 1000px; }
.js:not(.static) .scene[data-scene] { height: 210vh; height: 210svh; }
.js:not(.static) .scene[data-scene] .stick { position: sticky; top: 0; height: 100vh; height: 100svh; padding: 0; }
.js:not(.static) .scene[data-scene] .cw { opacity: 0; visibility: hidden; pointer-events: none; will-change: transform, opacity; }
.obj { position: relative; width: 100%; height: 100%; display: grid; place-items: center; perspective: 1100px; pointer-events: none; }
.obj::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(680px, 130vw); aspect-ratio: 1; translate: -50% -50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--cc) 28%, transparent), transparent); }
.o3 { position: relative; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
.cap { position: absolute; left: 0; right: 0; bottom: 11%; text-align: center; font-size: .78rem; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
.static .obj { display: none; }
.nb, .db { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.nb .f { position: absolute; backface-visibility: hidden; }
.nb .fr, .nb .bk { width: 210px; height: 280px; left: -105px; top: -140px; border-radius: 4px 14px 14px 4px; background: linear-gradient(135deg, color-mix(in srgb, var(--cc) 58%, #181a1f), color-mix(in srgb, var(--cc) 26%, #08090b)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 8px 0 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2); }
.nb .fr { transform: translateZ(23px); } .nb .bk { transform: rotateY(180deg) translateZ(23px); }
.nb .fr svg { position: absolute; left: 50%; top: 27%; width: 56px; height: 56px; translate: -50% -50%; color: color-mix(in srgb, var(--cc) 65%, #fff); opacity: .92; }
.nb .fr i { position: absolute; left: 36px; right: 36px; height: 2px; background: rgba(255,255,255,.2); border-radius: 2px; }
.nb .fr b { position: absolute; top: 0; bottom: 0; right: 34px; width: 9px; background: color-mix(in srgb, var(--cc) 38%, #000); box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.nb .sp { width: 46px; height: 280px; left: -23px; top: -140px; transform: rotateY(-90deg) translateZ(105px); background: linear-gradient(90deg, color-mix(in srgb, var(--cc) 40%, #0b0c0e), color-mix(in srgb, var(--cc) 24%, #050506)); }
.nb .pg { width: 46px; height: 270px; left: -23px; top: -135px; transform: rotateY(90deg) translateZ(103px); background: repeating-linear-gradient(90deg, #ece9e2 0 2px, #cbc7be 2px 3px); }
.nb .tp, .nb .bt { width: 204px; height: 46px; left: -102px; top: -23px; background: repeating-linear-gradient(180deg, #ece9e2 0 2px, #cbc7be 2px 3px); }
.nb .tp { transform: rotateX(90deg) translateZ(138px); } .nb .bt { transform: rotateX(-90deg) translateZ(138px); }
.db .cf, .db .cd { position: absolute; left: 0; top: 0; backface-visibility: hidden; }

/* Statement: words light up as you scroll */
.statement { margin: clamp(5rem, 14vw, 10rem) auto 0; padding: clamp(3rem, 8vw, 5.5rem) 0 1rem; border-top: 1px solid var(--line); text-align: center; }
.statement h2 { font-size: clamp(2.2rem, 7.4vw, 5rem); line-height: 1.06; max-width: 14ch; margin-inline: auto; }
.statement h2 .w { display: inline-block; opacity: .2; transform: translateY(8px); transition: opacity .5s var(--ease), transform .5s var(--ease); margin-inline: .12em; }
.statement h2 .w.on { opacity: 1; transform: none; }
.by { margin: 2.4rem 0 0; color: var(--muted); font-size: .95rem; letter-spacing: .02em; }
.by::before { content: ""; display: block; width: 44px; height: 1px; margin: 0 auto 1.2rem; background: var(--accent); }
footer { padding: 2.5rem 0; color: var(--muted); font-size: .85rem; }
footer .wrap { display: flex; flex-direction: column; align-items: center; gap: .7rem; text-align: center; }
footer .brand { font-size: .92rem; color: var(--text); }

/* Scroll reveal */
.js .rv { opacity: 0; transform: translateY(32px); transition: opacity .7s var(--ease), transform .7s var(--ease); transition-delay: var(--d, 0s); }
.js .rv.in { opacity: 1; transform: none; }
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --ang: 360deg; } }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes up { from { transform: translateY(105%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes drip { 0% { transform: translateY(-24px); } 70%, 100% { transform: translateY(54px); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

function syncStatic() { root.classList.toggle("static", reduce.matches); }
(reduce.addEventListener ? reduce.addEventListener.bind(reduce, "change") : reduce.addListener.bind(reduce))(() => { syncStatic(); measure(); request(); });

function measure() {
  vh = innerHeight; pinH = document.getElementById("heroPin").offsetHeight; docMax = Math.max(1, document.documentElement.scrollHeight - vh);

}
function request() { if (!running) { running = true; requestAnimationFrame(render); } }

  nav.classList.toggle("solid", y > 40);
  if (y <= 160 || y < lastY - 3) nav.classList.remove("hide");
  else if (y > lastY + 3 && !document.querySelector(".menu:not([hidden])")) nav.classList.add("hide");

  cur.x += (tgt.x - cur.x) * .1; cur.y += (tgt.y - cur.y) * .1;
  if (y < pinH) {
    const tp = clamp(y / Math.max(1, pinH - vh), 0, 1);
    if (Math.abs(tp - hpS) > .0006) { hpS += (tp - hpS) * .2; need = true; } else hpS = tp;
    const hp = hpS;
    hero.style.opacity = (1 - sm(clamp((hp - .55) / .45, 0, 1))).toFixed(3);
    if (hp !== lastHp) { lastHp = hp; updateHero(hp); }
    heroSvg.style.transform = "translate3d(" + (cur.x * 10).toFixed(1) + "px," + (cur.y * 6).toFixed(1) + "px,0)";
  }
  blobs[0].style.transform = "translate3d(0," + (y * -.1).toFixed(1) + "px,0)";
  blobs[1].style.transform = "translate3d(0," + (y * .08).toFixed(1) + "px,0)";
  blobs[2].style.transform = "translate3d(" + (y * -.05).toFixed(1) + "px,0,0)";

    const range = Math.max(1, s.h - vh), p = clamp((y - s.top) / range, 0, 1), e = clamp((y - s.top + vh * .6) / (range + vh * .6), 0, 1);

    else { s.done = null; s.sp += (p - s.sp) * .16; s.se += (e - s.se) * .16; if (Math.abs(p - s.sp) > .0007 || Math.abs(e - s.se) > .0007) need = true; }

    if (+op > .005) {

      const sc = (s.k * (.82 + .18 * enter) * (1 + .3 * out)).toFixed(3);
      s.o3.style.transform = s.kind === "notebook"
        ? "scale(" + sc + ") rotateX(" + (-14 + a * 12).toFixed(1) + "deg) rotateY(" + (-32 + a * 900).toFixed(1) + "deg) rotateZ(" + (Math.sin(a * 7) * 3).toFixed(1) + "deg)"
        : "scale(" + sc + ") rotateX(-16deg) rotateY(" + (a * 720).toFixed(1) + "deg) rotateZ(" + (-14 + a * 28).toFixed(1) + "deg)";

addEventListener("scroll", request, { passive: true });
addEventListener("resize", () => { measure(); request(); });
addEventListener("load", () => { measure(); request(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); request(); });
if (fine.matches && !reduce.matches) addEventListener("pointermove", e => {
  tgt.x = (e.clientX / innerWidth - .5) * 2; tgt.y = (e.clientY / innerHeight - .5) * 2; tgt.mx = e.clientX; tgt.my = e.clientY;

}, { passive: true });

/* Reveal on enter (also reveals items you scrolled straight past) */
